---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: firewallpolicies.networking.aviatrix.com
spec:
  group: networking.aviatrix.com
  names:
    kind: FirewallPolicy
    listKind: FirewallPolicyList
    plural: firewallpolicies
    singular: firewallpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FirewallPolicy is a specification for a FirewallPolicy resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              rules:
                description: Rules defines the rules for the firewall policy.
                items:
                  properties:
                    action:
                      description: |-
                        Action is the action to take when the rule matches.
                        It can be either "permit" or "deny".
                      enum:
                      - permit
                      - deny
                      - intrusion_detection_permit
                      type: string
                    decryptPolicy:
                      description: |-
                        Decryption options for the rule.
                        Supported values are:
                        - "decryptAllowed": Decryption is allowed for the flow.
                        - "decryptNotAllowed": Decryption is not allowed for the flow.
                      enum:
                      - decryptAllowed
                      - decryptNotAllowed
                      type: string
                    destinationSmartGroups:
                      description: DestinationSmartGroups specifies the destination
                        smart groups to which this rule applies.
                      items:
                        description: FirewallPolicySmartGroupRef is a reference to
                          a smart group or web group.
                        properties:
                          name:
                            description: |-
                              Name references a smart group or web group by its name.
                              Either Name or UUID must be set, but not both.
                            type: string
                          uuid:
                            description: |-
                              UUID references a smart group or web group by its UUID.
                              Either Name or UUID must be set, but not both.
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: Either name or uuid must be set, but not both.
                          rule: (has(self.name) || has(self.uuid)) && !(has(self.name)
                            && has(self.uuid))
                      minItems: 1
                      type: array
                    endPort:
                      description: |-
                        EndPort specifies the end port to match for this rule.
                        It is used for port ranges.
                        If EndPort is set, Port must also be set.
                      type: integer
                    flowAppRequirement:
                      description: |-
                        Flow application requirement for the policy.
                        Supported values are:
                        - "tlsRequired": TLS is required for the flow.
                        - "tlsNotRequired": TLS is not required for the flow.
                      enum:
                      - tlsRequired
                      - tlsNotRequired
                      type: string
                    logProfile:
                      description: |-
                        LogProfile specifies how sessions are logged.
                        It can only be set if Logging is true.
                        Common values are:
                        - "start": Log at session start
                        - "end": Log at session end
                        - "start/end": Log at both session start and end
                        If not set, the default log profile of the Aviatrix controller ("start") is used.
                      type: string
                    logging:
                      description: Logging indicates whether to log traffic that matches
                        this rule.
                      type: boolean
                    name:
                      description: |-
                        Name is the name of the rule.
                        It must be unique within the policy.
                      minLength: 1
                      type: string
                    port:
                      description: Ports specifies the port to match for this rule.
                      type: integer
                    protocol:
                      description: |-
                        Protocol specifies the protocol to match for this rule.
                        It can be either "tcp", "udp", "icmp", or "any".
                      enum:
                      - tcp
                      - udp
                      - icmp
                      - any
                      type: string
                    selector:
                      description: |-
                        Selector defines the resources to which this rule applies.
                        It always matches workloads in the same namespace and cluster as the policy.
                      properties:
                        matchLabels:
                          additionalProperties:
                            type: string
                          type: object
                        service:
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: service is forbidden when matchLabels is set
                        rule: 'has(self.matchLabels) ?  (!has(self.service) || size(self.service)
                          == 0) : true'
                      - message: matchLabels is forbidden when service is set
                        rule: '(has(self.service) && size(self.service) > 0) ?  !has(self.matchLabels)
                          : true'
                    tlsProfile:
                      description: TLSProfile specifies the name of the TLS profile
                        to be used for the policy.
                      type: string
                    watch:
                      description: Whether to enable watch mode for the policy.
                      type: boolean
                    webGroups:
                      description: WebGroups specifies the web groups to which this
                        rule applies.
                      items:
                        description: FirewallPolicySmartGroupRef is a reference to
                          a smart group or web group.
                        properties:
                          name:
                            description: |-
                              Name references a smart group or web group by its name.
                              Either Name or UUID must be set, but not both.
                            type: string
                          uuid:
                            description: |-
                              UUID references a smart group or web group by its UUID.
                              Either Name or UUID must be set, but not both.
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: Either name or uuid must be set, but not both.
                          rule: (has(self.name) || has(self.uuid)) && !(has(self.name)
                            && has(self.uuid))
                      type: array
                  required:
                  - destinationSmartGroups
                  - name
                  type: object
                minItems: 1
                type: array
              smartGroups:
                description: SmartGroups defines the smart groups for the firewall
                  policy.
                items:
                  properties:
                    name:
                      type: string
                    selectors:
                      items:
                        properties:
                          accountId:
                            description: |-
                              AccountID is the ID of the account  to match for dynamic smart groups.
                              Requires Type to be set.
                            type: string
                          accountName:
                            description: |-
                              AccountName is the name of the account to which the resource belongs.
                              Requires Type to be set.
                            type: string
                          cidr:
                            description: |-
                              CIDR makes the smart group match resources within the specified CIDR.
                              If CIDR is set no other fields must be set.
                            type: string
                          extArgs:
                            additionalProperties:
                              type: string
                            description: ExtArgs are additional arguments for the
                              external feed.
                            type: object
                          external:
                            description: |-
                              External is the name of the external feed.
                              If set, no other fields except ExtArgs must be set.
                            type: string
                          k8sClusterId:
                            description: |-
                              K8sClusterID is the Kubernetes cluster ID to match for dynamic smart groups.
                              Requires Type to be set to "k8s".
                            type: string
                          k8sNamespace:
                            description: |-
                              K8sNamespace is the Kubernetes namespace to match for dynamic smart groups.
                              Requires Type to be set to "k8s".
                            type: string
                          k8sPodName:
                            description: |-
                              K8sPodName is the Kubernetes pod name to match for dynamic smart groups.
                              Requires Type to be set to "k8s".
                            type: string
                          k8sService:
                            description: |-
                              K8sService is the Kubernetes service name to match for dynamic smart groups.
                              Requires Type to be set to "k8s".
                            type: string
                          name:
                            description: |-
                              Name is the name of the resource to match for dynamic smart groups.
                              Requires Type to be set.
                            type: string
                          region:
                            description: |-
                              Region is the region of the resource to match for dynamic smart groups.
                              Requires Type to be set.
                            type: string
                          s2c:
                            description: |-
                              S2C is the S2C (Site to Cloud) identifier for the resource.
                              If set, no other fields must be set.
                            type: string
                          tags:
                            additionalProperties:
                              type: string
                            description: |-
                              Tags are additional tags to match for dynamic smart groups.
                              Each tag is a key-value pair, where the key is the tag name and the value is the tag value.
                              If Type is set to "k8s", the tags refer to Kubernetes labels.
                              Requires Type to be set.
                            type: object
                          type:
                            description: Type specifies the type of resource to match
                              for dynamic smart groups. Possible values are "vpc",
                              "subnet", "vm", "k8s", "k8s_node", "serverless".
                            type: string
                          zone:
                            description: |-
                              Zone is the zone of the resource to match for dynamic smart groups.
                              Requires Type to be set.
                            type: string
                        type: object
                      type: array
                  required:
                  - name
                  type: object
                type: array
              webGroups:
                description: WebGroups defines the web groups for the firewall policy.
                items:
                  properties:
                    domains:
                      items:
                        type: string
                      type: array
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
            type: object
          status:
            properties:
              attachmentPoint:
                type: string
              lastReconciledGeneration:
                format: int64
                type: integer
              ruleset:
                description: |-
                  Ruleset contains the uuid of the policy ruleset associated with this firewall policy.
                  Every firewall policy maps to a single ruleset or policy list.
                type: string
              smartGroups:
                items:
                  properties:
                    name:
                      type: string
                    uuid:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              webGroups:
                items:
                  properties:
                    name:
                      type: string
                    uuid:
                      type: string
                  required:
                  - name
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
